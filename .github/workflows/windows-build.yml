name: Windows Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Create the supplied shared application icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Assets | Out-Null
          $png = [Convert]::FromBase64String('')
          [IO.File]::WriteAllBytes('Assets/EasyMusicScore.png', $png)
          Add-Type -AssemblyName System.Drawing
          $source = [System.Drawing.Image]::FromFile((Resolve-Path 'Assets/EasyMusicScore.png'))
          $bmp = New-Object System.Drawing.Bitmap 256,256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::Transparent)
          $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
          $targetWidth = [int](256 * $source.Width / $source.Height)
          $x = [int]((256 - $targetWidth) / 2)
          $g.DrawImage($source, $x, 0, $targetWidth, 256)
          $ms = New-Object System.IO.MemoryStream
          $bmp.Save($ms,[System.Drawing.Imaging.ImageFormat]::Png)
          $bytes = $ms.ToArray()
          $fs = [System.IO.File]::Create('Assets/EasyMusicScore.ico')
          $bw = New-Object System.IO.BinaryWriter($fs)
          $bw.Write([UInt16]0); $bw.Write([UInt16]1); $bw.Write([UInt16]1)
          $bw.Write([Byte]0); $bw.Write([Byte]0); $bw.Write([Byte]0); $bw.Write([Byte]0)
          $bw.Write([UInt16]1); $bw.Write([UInt16]32); $bw.Write([UInt32]$bytes.Length); $bw.Write([UInt32]22)
          $bw.Write($bytes); $bw.Close(); $fs.Close()
          $g.Dispose(); $bmp.Dispose(); $source.Dispose(); $ms.Dispose()
      - name: Publish self-contained single-file Windows app
        run: dotnet publish EasyMusicScore.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o publish
      - name: Prepare standalone EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          if (!(Test-Path publish\EasyMusicScore.exe)) { throw 'Published EXE was not found.' }
          Move-Item publish\EasyMusicScore.exe release\EasyMusicScore_v1.08.exe
          Get-Item release\EasyMusicScore_v1.08.exe | Format-List Name,Length
      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: EasyMusicScore_v1.08-Windows-x64
          path: release\EasyMusicScore_v1.08.exe
          if-no-files-found: error
          retention-days: 14
