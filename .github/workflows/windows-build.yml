name: Windows Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained Windows app
        run: dotnet publish EasyMusicScore.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Package runnable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item publish\* release\ -Recurse -Force
          Compress-Archive -Path release\* -DestinationPath EasyMusicScore-Windows-x64.zip -Force
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: EasyMusicScore-Windows-x64
          path: EasyMusicScore-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
